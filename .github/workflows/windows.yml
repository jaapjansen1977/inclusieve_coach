name: Windows installer
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: InclusieveCoach-Windows-x64
          path: output/InclusieveCoach-Setup.exe
      - name: Installeer en start de gebundelde desktopapp
        shell: pwsh
        run: |
          $p = Start-Process output/InclusieveCoach-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode) { throw "Installatie mislukt" }
          $app = Start-Process "$env:LOCALAPPDATA/Programs/InclusieveCoach/InclusieveCoach.exe" -PassThru
          Start-Sleep 8
          $app.Refresh()
          if ($app.HasExited -or !$app.MainWindowHandle) { throw "Geen desktopvenster" }
          $app.CloseMainWindow()
      - name: WAV-import met echte CPU-modellen en gecontroleerde feedback
        shell: pwsh
        run: |
          ./tests/prepare-models.ps1
          python -m tests.accept "$env:LOCALAPPDATA/InclusieveCoach/modellen"
