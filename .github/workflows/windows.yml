name: Windows installer
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 20
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: InclusieveCoach-Windows-x64
          path: output/InclusieveCoach-Setup.exe
      - name: Installeer en start de gebundelde desktopapp
        shell: pwsh
        run: |
          $p = Start-Process output/InclusieveCoach-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode) { throw "Installatie mislukt" }
          $app = Start-Process "$env:LOCALAPPDATA/Programs/InclusieveCoach/InclusieveCoach.exe" -PassThru
          Start-Sleep 8
          $app.Refresh()
          if ($app.HasExited -or !$app.MainWindowHandle) { throw "Geen desktopvenster" }
          $app.CloseMainWindow()
      - name: WAV-import met echte CPU-modellen en gecontroleerde feedback
        shell: pwsh
        run: |
          ./tests/prepare-models.ps1
          $models = "$env:LOCALAPPDATA/InclusieveCoach/modellen"
          $app = "$env:LOCALAPPDATA/Programs/InclusieveCoach/InclusieveCoach.exe"
          $report = "$env:RUNNER_TEMP/metingen.txt"
          $p = Start-Process $app -ArgumentList '--test-fictieve-scenarios',('"' + $models + '"'),('"' + $report + '"') -PassThru
          $peak = 0
          $timer = [Diagnostics.Stopwatch]::StartNew()
          while (!$p.WaitForExit(200) -and $timer.Elapsed.TotalSeconds -lt 180) {
            $p.Refresh()
            $peak = [Math]::Max([int64]$peak, [int64]$p.PeakWorkingSet64)
          }
          Write-Host "Piekwerkset (bytes): $peak"
          if (!$p.HasExited -or $p.ExitCode -ne 0) { throw "Acceptatietest mislukt" }
          Get-Content $report
